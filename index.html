<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa ISA - Artículos para el Hogar</title>
  <link rel="icon" href="assets/img/logo-icono.svg">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <div id="encabezado"></div>

  <section class="portada">
    <div class="contenedor">
      <div>
        <h1>Todo para tu casa, en un solo lugar</h1>
        <p>Televisores, celulares, aires acondicionados y electrodomésticos con envío a todo el país.</p>
        <div class="acciones-portada">
          <a class="boton boton-principal" href="pages/tv-audio-video.html">Ver productos</a>
          <span class="pastilla">Hasta 12 cuotas sin interés</span>
        </div>
      </div>
      <div class="imagen-portada">
        <img src="assets/img/portada.svg" alt="Living equipado con televisor y aire acondicionado">
      </div>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor">
      <h2 class="titulo-seccion">Comprá por categoría</h2>
      <!-- Las tarjetas salen del array PAGINAS -->
      <div class="grilla-categorias" id="categorias"></div>
    </div>
  </section>

  <section class="seccion seccion-clara">
    <div class="contenedor">
      <h2 class="titulo-seccion">Productos destacados</h2>
      <!-- Las cards las dibuja el componente de cards.js -->
      <div class="grilla-productos" id="productos" data-categoria="destacados"></div>
    </div>
  </section>

  <!-- El pie tambien se arma desde JavaScript -->
  <div id="pie"></div>

  <script src="assets/js/datos.js"></script>
  <script src="assets/js/sesion.js"></script>
  <script src="assets/js/componentes.js"></script>
  <script src="assets/js/cards.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
