<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa ISA - Crear cuenta</title>
  <link rel="icon" href="../assets/img/logo-icono.svg">
  <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>

  <div id="encabezado"></div>

  <main class="pantalla-formulario">
    <div class="caja-formulario">
      <h1>Crear cuenta</h1>
      <p class="bajada">Registrate para comprar más rápido y seguir tus pedidos.</p>

      <form id="form-registro" action="../index.html" method="post">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>
          </div>
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="campo">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento" required>
          </div>
        <button type="submit" class="boton boton-principal boton-ancho">Crear cuenta</button>
      </form>

      <p class="pie-formulario">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </main>

  <div id="pie"></div>

  <script src="../assets/js/datos.js"></script>
  <script src="../assets/js/sesion.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/componentes.js"></script>
  <script src="../assets/js/cards.js"></script>
  <script src="../assets/js/vista-carrito.js"></script>
  <script src="../assets/js/vista-producto.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
