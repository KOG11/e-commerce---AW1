<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa ISA - Iniciar sesión</title>
  <link rel="icon" href="../assets/img/logo-icono.svg">
  <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>

  <!-- El encabezado lo inserta el componente de componentes.js -->
  <div id="encabezado"></div>

  <main class="pantalla-formulario">
    <div class="caja-formulario">
      <h1>Iniciar sesión</h1>
      <p class="bajada">Ingresá con tu email y contraseña para continuar.</p>

      <form id="form-login" action="../index.html" method="post">
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
          </div>
        <button type="submit" class="boton boton-principal boton-ancho">Iniciar sesión</button>
      </form>

      <p class="pie-formulario">¿No tenés cuenta? <a href="registro.html">Crear cuenta</a></p>
    </div>
  </main>

  <!-- El pie tambien se arma desde JavaScript -->
  <div id="pie"></div>

  <script src="../assets/js/datos.js"></script>
  <script src="../assets/js/sesion.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/componentes.js"></script>
  <script src="../assets/js/cards.js"></script>
  <script src="../assets/js/vista-carrito.js"></script>
  <script src="../assets/js/vista-producto.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
